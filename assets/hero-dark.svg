<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Matheus Costa de Jesus — Full-Stack Software Engineer">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4ADE80"><animate attributeName="stop-color" values="#4ADE80;#FFFFFF;#A3A3A3;#4ADE80" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#FFFFFF"><animate attributeName="stop-color" values="#FFFFFF;#A3A3A3;#4ADE80;#FFFFFF" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#A3A3A3"><animate attributeName="stop-color" values="#A3A3A3;#4ADE80;#FFFFFF;#A3A3A3" dur="10s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="asciiGrad" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#86EFAC"/>
    <stop offset="0.45" stop-color="#4ADE80"/>
    <stop offset="1" stop-color="#22C55E"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 -100; 0 100; 0 -100" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <clipPath id="winClip"><rect x="24" y="24" width="1132" height="562" rx="18"/></clipPath>
</defs>
<rect width="1180" height="610" fill="#000000"/>
<rect width="1180" height="610" fill="url(#grid)"/>
<circle cx="1080" cy="100" r="180" fill="#4ADE80" opacity="0.08" filter="url(#blur)"/>
<circle cx="100" cy="540" r="150" fill="#A3A3A3" opacity="0.07" filter="url(#blur)"/>

<g clip-path="url(#winClip)">
