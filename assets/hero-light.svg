<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Matheus Costa de Jesus — Full-Stack Software Engineer">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#15803D"><animate attributeName="stop-color" values="#15803D;#000000;#525252;#15803D" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#000000"><animate attributeName="stop-color" values="#000000;#525252;#15803D;#000000" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#525252"><animate attributeName="stop-color" values="#525252;#15803D;#000000;#525252" dur="10s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="asciiGrad" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#166534"/>
    <stop offset="0.45" stop-color="#15803D"/>
    <stop offset="1" stop-color="#16A34A"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 -100; 0 100; 0 -100" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  </pattern>
  <clipPath id="winClip"><rect x="24" y="24" width="1132" height="562" rx="18"/></clipPath>
</defs>
<rect width="1180" height="610" fill="#FFFFFF"/>
<rect width="1180" height="610" fill="url(#grid)"/>
<circle cx="1080" cy="100" r="180" fill="#15803D" opacity="0.08" filter="url(#blur)"/>
<circle cx="100" cy="540" r="150" fill="#525252" opacity="0.07" filter="url(#blur)"/>

<g clip-path="url(#winClip)">
  <rect x="24" y="24" width="1132" height="562" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1132" height="46" fill="#F5F5F5"/>
  <line x1="24" y1="70" x2="1156" y2="70" stroke="url(#accent)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="52" cy="47" r="5.5" fill="#15803D"/>
  <circle cx="72" cy="47" r="5.5" fill="#000000"/>
  <circle cx="92" cy="47" r="5.5" fill="#525252"/>
  <text x="590" y="52" text-anchor="middle" font-size="12" fill="#525252">matheus@dev: ~/profile — ./profile.sh --live</text>
